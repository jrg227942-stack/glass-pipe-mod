name: Build Mod
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: gradle
        run: wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip && unzip -q gradle-8.8-bin.zip && ./gradle-8.8/bin/gradle build --no-daemon --info
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: glass-pipe-transport-mod
          path: build/libs/glass-pipe-transport-*.jar
          if-no-files-found: error
