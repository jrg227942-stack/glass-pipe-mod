 name: Build Mod
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Gradle 8.8
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q gradle-8.8-bin.zip
          echo "$PWD/gradle-8.8/bin" >> $GITHUB_PATH
      - name: Build
        run: gradle build --no-daemon --info
      - uses: actions/upload-artifact@v4
        with:
          name: glass-pipe-transport-mod
          path: build/libs/glass-pipe-transport-*.jar
          if-no-files-found: error
